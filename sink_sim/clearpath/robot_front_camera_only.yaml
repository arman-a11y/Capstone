# Clearpath Ridgeback (R100) + KUKA LBR iiwa 7 R800 + front RealSense only + front lidar (lighter on a laptop),
# for the sink alignment sim.
# Copy this file to ~/clearpath/robot.yaml (the file name must stay robot.yaml).
#
# Rough heights (from the R100 URDF): base_link is ~0.03 m above the floor and
# default_mount (the deck surface) is ~0.32 m above the floor.
#
# Clearpath doesn't include the KUKA iiwa in its arm list, so the arm is added
# through platform.extras as a custom URDF (sink_sim/urdf/iiwa_arm.urdf.xacro).
# Where it sits on the deck is set at the top of that file.

serial_number: r100-0000
version: 0

system:
  hosts:
    - hostname: cpr-r100-0000
      ip: 192.168.131.1
  ros2:
    namespace: r100_0000

platform:
  drivetrain:
    control: omni_4wd          # mecanum wheels: forward, sideways and turning
    wheels:
      front: mecanum
      rear: mecanum
  extras:
    urdf:
      package: sink_sim
      path: urdf/iiwa_arm.urdf.xacro

sensors:
  camera:
    # camera_0: front RealSense at the front edge of the deck, looking straight
    # ahead (lens ~0.33 m above the floor, tags are at 0.45 m).
    - model: intel_realsense
      urdf_enabled: true
      launch_enabled: true
      parent: default_mount
      xyz: [0.42, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
  lidar2d:
    # lidar2d_0: the Ridgeback's built-in front Hokuyo (same spot as Clearpath's
    # sample config), used for SLAM / Nav2.
    - model: hokuyo_ust
      urdf_enabled: true
      launch_enabled: true
      parent: chassis_link
      xyz: [0.3922, 0.0, 0.1856]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        urg_node:
          laser_frame_id: lidar2d_0_laser
          ip_address: 192.168.131.20
          ip_port: 10940
          angle_min: -2.35619
          angle_max: 2.35619
