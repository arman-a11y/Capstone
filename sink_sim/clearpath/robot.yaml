# Husky A200 + UR5 + front/rear RealSense + 2D lidar, for the sink alignment sim.
# Copy this file to ~/clearpath/robot.yaml (the file name must stay robot.yaml).
# Preview changes live with:
#   ros2 launch clearpath_config_live view_model.launch.py setup_path:=$HOME/clearpath
#
# Rough heights (from the A200 URDF): base_link is ~0.13 m above the floor,
# the top plate surface is ~0.38 m above the floor.

serial_number: a200-0000
version: 0

system:
  hosts:
    - hostname: cpr-a200-0000
      ip: 192.168.131.1
  ros2:
    namespace: a200_0000

platform:
  attachments:
    - name: front_bumper
      type: a200.bumper
      parent: front_bumper_mount
    - name: rear_bumper
      type: a200.bumper
      parent: rear_bumper_mount
    - name: top_plate
      type: a200.top_plate
      model: pacs

manipulators:
  moveit:
    enable: true
  arms:
    # UR5 (CB series). Mounted a bit forward of the plate centre so it can
    # reach into the sink cabinet. Change ur_type to ur5e if your arm is an e-Series.
    - model: universal_robots
      parent: top_plate_default_mount
      xyz: [0.10, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      ur_type: ur5
      robot_ip: 192.168.131.40
      headless_mode: false
      poses:
        - name: up
          joints: [0.0, -1.5708, 0.0, -1.5708, 0.0, 0.0]

sensors:
  camera:
    # camera_0: front RealSense, sits just above the lidar at the front edge
    # of the top plate, looking straight ahead at tag height (~0.45 m).
    - model: intel_realsense
      urdf_enabled: true
      launch_enabled: true
      parent: top_plate_front_mount
      xyz: [0.0, 0.0, 0.09]
      rpy: [0.0, 0.0, 0.0]
    # camera_1: rear RealSense. Delete this block (or use
    # robot_front_camera_only.yaml) if you only end up with one camera.
    - model: intel_realsense
      urdf_enabled: true
      launch_enabled: true
      parent: top_plate_rear_mount
      xyz: [0.0, 0.0, 0.09]
      rpy: [0.0, 0.0, 3.14159]
  lidar2d:
    # lidar2d_0: front 2D lidar for SLAM / Nav2. Field of view is trimmed so
    # it does not see the arm behind it.
    - model: hokuyo_ust
      urdf_enabled: true
      launch_enabled: true
      parent: top_plate_front_mount
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        urg_node:
          laser_frame_id: lidar2d_0_laser
          ip_address: 192.168.131.20
          ip_port: 10940
          angle_min: -2.0
          angle_max: 2.0
